<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <hbox align="center" style="margin-bottom: 8px; gap: 8px">
    <html:label
      for="zotero-prefpane-__addonRef__-copyMode"
      data-l10n-id="pref-copy-mode"
    ></html:label>
    <menulist id="zotero-prefpane-__addonRef__-copyMode" preference="copyMode">
      <menupopup>
        <menuitem value="file" data-l10n-id="pref-mode-file" />
        <menuitem value="ref" data-l10n-id="pref-mode-ref" />
        <menuitem value="fulltext" data-l10n-id="pref-mode-fulltext" />
      </menupopup>
    </menulist>
  </hbox>

  <hbox align="center" style="margin-top: 6px; margin-bottom: 8px; gap: 8px">
    <html:label
      for="zotero-prefpane-__addonRef__-maxFullTextChars"
      data-l10n-id="pref-max-fulltext"
    ></html:label>
    <html:input
      type="number"
      id="zotero-prefpane-__addonRef__-maxFullTextChars"
      preference="maxFullTextChars"
      style="width: 110px"
    ></html:input>
  </hbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
